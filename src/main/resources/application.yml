spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000       # 24시간 (ms)
  refresh-expiration: 604800000  # 7일 (ms)

dart:
  api-key: ${DART_API_KEY:9a77df24ff2657a980e10641ce1e02cc25182d37}

data-go-kr:
  api-key: ${DATA_GO_KR_API_KEY:}

krx:
  api-key: ${KRX_API_KEY:}

dividend:
  scheduler:
    enabled: true   # 연간 배당 갱신 스케줄러 on/off
